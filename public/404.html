<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IOTA Card Game</title>
    <script>
      // GitHub Pages 404.html redirect for SPA
      // When GitHub Pages can't find a file, it serves 404.html
      // We need to redirect to index.html and preserve the original path
      (function() {
        const basePath = '/iota-board-game';
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        
        // Remove base path if present to get the clean path
        let cleanPath = path.startsWith(basePath) 
          ? path.slice(basePath.length) 
          : path;
        
        // Ensure cleanPath starts with /
        if (!cleanPath.startsWith('/')) {
          cleanPath = '/' + cleanPath;
        }
        
        // If we're already at index.html or root, don't redirect (avoid loops)
        if (cleanPath === '/index.html' || cleanPath === '/') {
          return;
        }
        
        // Store the original path in sessionStorage so index.html can restore it
        sessionStorage.setItem('404-redirect-path', cleanPath + search + hash);
        
        // Redirect to index.html - the app will check sessionStorage and navigate
        window.location.replace(basePath + '/index.html');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
